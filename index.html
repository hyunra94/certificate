<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수료증 조회</title>
  <link rel="icon" type="image/png" href="https://hyunra94.github.io/assets/kdigital-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #5B4EE8;
      --primary-light: #7B70F0;
      --primary-dark: #3D32C4;
      --primary-bg: #F0EEFF;
      --accent: #FFD600;
      --success: #1CB87E;
      --success-bg: #E8FBF4;
      --error: #E53E3E;
      --error-bg: #FFF5F5;
      --text: #1A1A2E;
      --text-muted: #6B7280;
      --border: #E5E7EB;
      --bg: #F4F3FF;
      --card: #FFFFFF;
      --shadow: 0 4px 24px rgba(91,78,232,0.08);
      --shadow-lg: 0 8px 40px rgba(91,78,232,0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      padding: 0 0 90px 0;
      color: var(--text);
    }

    /* 헤더 히어로 */
    .hero {
      background: linear-gradient(145deg, #5B4EE8 0%, #7B6FF5 50%, #9B8FFF 100%);
      padding: 28px 20px 56px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 240px; height: 240px;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: -40px; left: -40px;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
    }
    .hero-icon {
      width: 60px; height: 60px;
      background: rgba(255,255,255,0.15);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255,255,255,0.25);
      position: relative;
      z-index: 1;
    }
    .hero-icon svg { width: 30px; height: 30px; }
    .hero h1 {
      font-size: 22px;
      font-weight: 800;
      color: white;
      margin-bottom: 6px;
      position: relative;
      z-index: 1;
      letter-spacing: -0.5px;
    }
    .hero p {
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      line-height: 1.6;
      position: relative;
      z-index: 1;
    }

    /* 장식 수료증 아이콘 */
    .hero-deco {
      position: absolute;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.12;
      z-index: 0;
    }
    .hero-deco svg { width: 120px; height: 120px; }

    /* 컨텐츠 래퍼 */
    .content {
      max-width: 480px;
      margin: -24px auto 0;
      padding: 0 16px;
      position: relative;
      z-index: 2;
    }

    /* 카드 공통 */
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 22px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .card-title-icon {
      width: 32px; height: 32px;
      border-radius: 10px;
      background: var(--primary-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .card-title-icon svg { width: 16px; height: 16px; }
    .card-title h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    .card-title p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* 폼 */
    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      color: #9CA3AF;
    }
    .input-wrap input {
      width: 100%;
      padding: 13px 14px 13px 40px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text);
      background: #FAFAFA;
      outline: none;
      transition: all 0.2s;
    }
    .input-wrap input:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(91,78,232,0.1);
    }
    .input-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 5px;
      padding-left: 2px;
    }

    /* 버튼 */
    .btn-search {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
      letter-spacing: -0.3px;
    }
    .btn-search:hover { 
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
      box-shadow: 0 4px 16px rgba(91,78,232,0.35);
      transform: translateY(-1px);
    }
    .btn-search:disabled {
      background: #C4BFEE;
      box-shadow: none;
      transform: none;
      cursor: not-allowed;
    }
    .btn-search svg { width: 16px; height: 16px; }

    .privacy-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 10px;
    }
    .privacy-note svg { width: 12px; height: 12px; }

    /* 로딩 */
    .loading-wrap {
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--primary-bg);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-wrap p { font-size: 13px; color: var(--text-muted); }

    /* 결과 카드 */
    .result-card {
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .result-header-icon {
      width: 36px; height: 36px;
      background: var(--primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .result-header-icon svg { width: 18px; height: 18px; }
    .result-header h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .result-header p {
      font-size: 12px;
      color: var(--primary);
      font-weight: 600;
      margin-top: 1px;
    }

    .cert-item {
      padding: 16px 0;
      border-bottom: 1px solid #F3F4F6;
    }
    .cert-item:last-child { border-bottom: none; padding-bottom: 0; }
    .cert-item:first-child { padding-top: 0; }

    .cert-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }
    .cert-row:last-child { margin-bottom: 0; }
    .cert-row-icon {
      width: 28px; height: 28px;
      background: var(--primary-bg);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .cert-row-icon svg { width: 13px; height: 13px; color: var(--primary); }
    .cert-row-content {}
    .cert-row-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 2px;
    }
    .cert-row-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }

    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      background: white;
      color: var(--primary);
      border: 2px solid var(--primary);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Noto Sans KR', sans-serif;
      text-decoration: none;
      transition: all 0.2s;
      margin-top: 14px;
      cursor: pointer;
    }
    .btn-download:hover {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 14px rgba(91,78,232,0.25);
      transform: translateY(-1px);
    }
    .btn-download svg { width: 16px; height: 16px; }

    /* 에러 */
    .error-card {
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      text-align: center;
      animation: slideUp 0.3s ease;
    }
    .error-icon {
      width: 48px; height: 48px;
      background: var(--error-bg);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }
    .error-icon svg { width: 22px; height: 22px; color: var(--error); }
    .error-card h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .error-card p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* 문의 바 */
    .contact-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-top: 1px solid var(--border);
      padding: 12px 20px;
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
    }
    .contact-inner {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .contact-icon {
      width: 36px; height: 36px;
      background: var(--primary-bg);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .contact-icon svg { width: 16px; height: 16px; color: var(--primary); }
    .contact-text {
      flex: 1;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .contact-btns {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .contact-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .contact-btn:hover { opacity: 0.8; }
    .contact-btn.phone { background: var(--primary-bg); color: var(--primary); }
    .contact-btn.kakao { background: #FEE500; color: #391B1B; }
    .contact-btn svg { width: 13px; height: 13px; }
  </style>
</head>
<body>

<!-- 히어로 -->
<div class="hero">
  <div class="hero-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10 9 9 9 8 9"/>
      <circle cx="18" cy="19" r="3" fill="white" stroke="white"/>
      <path d="M16.5 19l1 1 2-2" stroke="#5B4EE8" stroke-width="1.5"/>
    </svg>
  </div>
  <h1>수료증 조회 및 다운로드</h1>
  <p>이름과 생년월일을 입력하면<br>수료증을 조회 하실 수 있습니다.</p>
  <div class="hero-deco">
    <svg viewBox="0 0 100 100" fill="white">
      <rect x="10" y="5" width="80" height="90" rx="6"/>
      <rect x="20" y="25" width="60" height="4" rx="2" fill="#5B4EE8" opacity="0.3"/>
      <rect x="20" y="35" width="50" height="3" rx="2" fill="#5B4EE8" opacity="0.2"/>
      <rect x="20" y="43" width="55" height="3" rx="2" fill="#5B4EE8" opacity="0.2"/>
      <rect x="20" y="51" width="40" height="3" rx="2" fill="#5B4EE8" opacity="0.2"/>
      <circle cx="50" cy="72" r="10" fill="#5B4EE8" opacity="0.15"/>
    </svg>
  </div>
</div>

<!-- 컨텐츠 -->
<div class="content">

  <!-- 조회 폼 카드 -->
  <div class="card">
    <div class="card-title">
      <div class="card-title-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#5B4EE8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </div>
      <div>
        <h2>수료증 조회</h2>
        <p>정확한 정보를 입력해 주세요.</p>
      </div>
    </div>

    <div class="field">
      <label>이름</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        <input type="text" id="name" placeholder="홍길동" maxlength="10" autocomplete="off">
      </div>
    </div>

    <div class="field">
      <label>생년월일</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <input type="text" id="birth" placeholder="900101" maxlength="6" inputmode="numeric" autocomplete="off">
      </div>
      <p class="input-hint">예: 900101 (생년월일 6자리)</p>
    </div>

    <button class="btn-search" id="searchBtn" onclick="search()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      수료증 조회하기
    </button>

    <div class="privacy-note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      입력하신 정보는 저장되지 않습니다.
    </div>
  </div>

  <!-- 결과 영역 -->
  <div id="result"></div>

</div>

<!-- 하단 문의 바 -->
<div class="contact-bar">
  <div class="contact-inner">
    <div class="contact-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.18 2 2 0 0 1 3.6 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 6.29 6.29l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
    </div>
    <p class="contact-text">시스템 오류 또는 수료 정보가 확인되지 않는 경우 문의해 주세요.</p>
    <div class="contact-btns">
      <a class="contact-btn phone" href="tel:0632208214">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.18 2 2 0 0 1 3.6 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 6.29 6.29l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        063-220-8214~6
      </a>
      <a class="contact-btn kakao" href="https://m.site.naver.com/1DNYL" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13">
          <path d="M12 3C6.477 3 2 6.477 2 10.5c0 2.599 1.561 4.878 3.938 6.259L4.5 21l4.563-2.4A11.3 11.3 0 0 0 12 18.999c5.523 0 10-3.477 10-7.5S17.523 3 12 3z"/>
        </svg>
        카카오톡 문의
      </a>
    </div>
  </div>
</div>

<script>
  const WORKER_URL = 'https://certificate-api.hyunra94.workers.dev/';

  const attempts = [];
  function isRateLimited() {
    const now = Date.now();
    const recent = attempts.filter(t => now - t < 60000);
    attempts.length = 0;
    recent.forEach(t => attempts.push(t));
    if (recent.length >= 5) return true;
    attempts.push(now);
    return false;
  }

  function showError(msg) {
    return `
      <div class="error-card">
        <div class="error-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>
        <h3>조회 실패</h3>
        <p>${msg}</p>
      </div>`;
  }

  async function search() {
    const name   = document.getElementById('name').value.trim();
    const birth  = document.getElementById('birth').value.trim();
    const result = document.getElementById('result');
    const btn    = document.getElementById('searchBtn');

    if (!name || birth.length !== 6) {
      result.innerHTML = showError('이름과 생년월일 6자리를 입력해주세요.');
      return;
    }

    if (isRateLimited()) {
      result.innerHTML = showError('잠시 후 다시 시도해주세요.<br>(1분에 최대 5회 조회 가능)');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = `<div class="spinner" style="width:18px;height:18px;border-width:2px;margin:0;"></div> 조회 중...`;
    result.innerHTML = `
      <div class="card">
        <div class="loading-wrap">
          <div class="spinner"></div>
          <p>수료증 정보를 조회하고 있습니다...</p>
        </div>
      </div>`;

    try {
      const res  = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, birth })
      });
      const data = await res.json();

      if (data.found) {
        const certsHtml = data.certs.map(cert => `
          <div class="cert-item">
            <div class="cert-row">
              <div class="cert-row-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
              </div>
              <div class="cert-row-content">
                <div class="cert-row-label">교육명</div>
                <div class="cert-row-value">${cert.course}</div>
              </div>
            </div>
            <div class="cert-row">
              <div class="cert-row-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
              </div>
              <div class="cert-row-content">
                <div class="cert-row-label">수료일</div>
                <div class="cert-row-value">${cert.date}</div>
              </div>
            </div>
            <a class="btn-download" href="${cert.certUrl}" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              수료증 다운로드
            </a>
          </div>
        `).join('');

        result.innerHTML = `
          <div class="result-card">
            <div class="result-header">
              <div class="result-header-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </div>
              <div>
                <h3>조회된 수료 정보</h3>
                <p>${name}님의 수료증을 확인했습니다.</p>
              </div>
            </div>
            ${certsHtml}
          </div>`;
      } else {
        result.innerHTML = showError('수료증 정보를 찾을 수 없습니다.<br>이름 또는 생년월일을 다시 확인해주세요.');
      }

    } catch {
      result.innerHTML = showError('오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
    }

    btn.disabled = false;
    btn.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      수료증 조회하기`;
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') search();
  });
</script>
</body>
</html>
